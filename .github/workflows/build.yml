name: Build Bob Companion

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 8.12
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'

      - name: Build mod and sources
        run: gradle build --no-daemon

      - name: Upload distributable mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: bob-companion
          path: build/libs/bob-companion-0.1.0.jar
          if-no-files-found: error
          retention-days: 30

      - name: Upload sources JAR
        uses: actions/upload-artifact@v4
        with:
          name: bob-companion-sources
          path: build/libs/bob-companion-0.1.0-sources.jar
          if-no-files-found: error
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download built mod JAR
        uses: actions/download-artifact@v4
        with:
          name: bob-companion
          path: release

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release/bob-companion-*.jar
